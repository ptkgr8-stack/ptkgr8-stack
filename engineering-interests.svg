<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <rect width="1000" height="500" rx="18" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="498" rx="17" fill="none" stroke="#30363d"/>

  <!-- animated terminal scan -->
  <rect x="35" y="28" width="930" height="2" fill="#8B7CFF" opacity=".25">
    <animate attributeName="x" values="35;935;35" dur="5s" repeatCount="indefinite"/>
  </rect>

  <text x="40" y="68" fill="#8B7CFF" font-family="monospace" font-size="24" font-weight="700">
    ENGINEERING.INTERESTS
  </text>
  <text x="790" y="68" fill="#8B7CFF" font-family="monospace" font-size="15">
    SYSTEMS.ONLINE
    <animate attributeName="opacity" values="1;.35;1" dur="1.6s" repeatCount="indefinite"/>
  </text>

  <!-- AI panel -->
  <g>
    <rect x="40" y="100" width="440" height="155" rx="12" fill="#111820" stroke="#30363d"/>
    <circle cx="65" cy="128" r="6" fill="#8B7CFF">
      <animate attributeName="r" values="5;8;5" dur="1.8s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.45;1" dur="1.8s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="135" fill="#f0f6fc" font-family="monospace" font-size="18" font-weight="700">AI.SYSTEM</text>
    <text x="65" y="170" fill="#c9d1d9" font-family="monospace" font-size="15">├─ Machine Learning</text>
    <text x="65" y="197" fill="#c9d1d9" font-family="monospace" font-size="15">├─ Computer Vision</text>
    <text x="65" y="224" fill="#c9d1d9" font-family="monospace" font-size="15">├─ OCR</text>
    <text x="65" y="251" fill="#c9d1d9" font-family="monospace" font-size="15">└─ Intelligent Automation</text>
  </g>

  <!-- Software panel -->
  <g>
    <rect x="520" y="100" width="440" height="155" rx="12" fill="#111820" stroke="#30363d"/>
    <circle cx="545" cy="128" r="6" fill="#8B7CFF">
      <animate attributeName="r" values="5;8;5" dur="2.1s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.45;1" dur="2.1s" repeatCount="indefinite"/>
    </circle>
    <text x="562" y="135" fill="#f0f6fc" font-family="monospace" font-size="18" font-weight="700">SOFTWARE.SYSTEMS</text>
    <text x="545" y="170" fill="#c9d1d9" font-family="monospace" font-size="15">├─ Backend Systems</text>
    <text x="545" y="197" fill="#c9d1d9" font-family="monospace" font-size="15">├─ REST APIs</text>
    <text x="545" y="224" fill="#c9d1d9" font-family="monospace" font-size="15">├─ Databases</text>
    <text x="545" y="251" fill="#c9d1d9" font-family="monospace" font-size="15">└─ Full-Stack Development</text>
  </g>

  <!-- Distributed panel -->
  <g>
    <rect x="40" y="280" width="440" height="155" rx="12" fill="#111820" stroke="#30363d"/>
    <circle cx="65" cy="308" r="6" fill="#8B7CFF">
      <animate attributeName="r" values="5;8;5" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.45;1" dur="2.4s" repeatCount="indefinite"/>
    </circle>
    <text x="82" y="315" fill="#f0f6fc" font-family="monospace" font-size="18" font-weight="700">DISTRIBUTED.SYSTEMS</text>
    <text x="65" y="350" fill="#c9d1d9" font-family="monospace" font-size="15">├─ Offline-First Architecture</text>
    <text x="65" y="377" fill="#c9d1d9" font-family="monospace" font-size="15">├─ CRDT</text>
    <text x="65" y="404" fill="#c9d1d9" font-family="monospace" font-size="15">├─ Synchronization</text>
    <text x="65" y="431" fill="#c9d1d9" font-family="monospace" font-size="15">└─ Mesh Connectivity</text>
  </g>

  <!-- Security panel -->
  <g>
    <rect x="520" y="280" width="440" height="155" rx="12" fill="#111820" stroke="#30363d"/>
    <circle cx="545" cy="308" r="6" fill="#8B7CFF">
      <animate attributeName="r" values="5;8;5" dur="1.9s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;.45;1" dur="1.9s" repeatCount="indefinite"/>
    </circle>
    <text x="562" y="315" fill="#f0f6fc" font-family="monospace" font-size="18" font-weight="700">SECURITY.SYSTEMS</text>
    <text x="545" y="350" fill="#c9d1d9" font-family="monospace" font-size="15">├─ Network Security</text>
    <text x="545" y="377" fill="#c9d1d9" font-family="monospace" font-size="15">├─ Authentication</text>
    <text x="545" y="404" fill="#c9d1d9" font-family="monospace" font-size="15">└─ Security-Aware Systems</text>
  </g>

  <!-- subtle moving activity line -->
  <rect x="40" y="470" width="180" height="2" fill="#8B7CFF" opacity=".8">
    <animate attributeName="x" values="40;780;40" dur="6s" repeatCount="indefinite"/>
  </rect>
  <text x="245" y="478" fill="#6e7681" font-family="monospace" font-size="12">
    AI • SOFTWARE • DISTRIBUTED • SECURITY
  </text>
</svg>
