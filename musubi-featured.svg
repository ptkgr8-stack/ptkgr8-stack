<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="520" viewBox="0 0 1000 520">
  <rect width="1000" height="520" rx="20" fill="#0d1117"/>
  <rect x="1" y="1" width="998" height="518" rx="19" fill="none" stroke="#30363d"/>

  <!-- header -->
  <text x="42" y="58" fill="#f0f6fc" font-family="monospace" font-size="28" font-weight="700">MUSUBI</text>
  <text x="42" y="84" fill="#8b7cff" font-family="monospace" font-size="13">PRIVATE BUILD // CONNECTION LAYER</text>

  <rect x="805" y="34" width="150" height="30" rx="15" fill="#151b25" stroke="#30363d"/>
  <circle cx="823" cy="49" r="5" fill="#8b7cff">
    <animate attributeName="opacity" values="1;.35;1" dur="1.5s" repeatCount="indefinite"/>
  </circle>
  <text x="837" y="54" fill="#c9d1d9" font-family="monospace" font-size="12">BUILD ACTIVE</text>

  <line x1="42" y1="108" x2="958" y2="108" stroke="#30363d"/>

  <!-- central connection ring -->
  <circle cx="500" cy="270" r="82" fill="#111820" stroke="#30363d"/>
  <circle cx="500" cy="270" r="62" fill="none" stroke="#8b7cff" stroke-width="2" stroke-dasharray="5 9">
    <animateTransform attributeName="transform" type="rotate" from="0 500 270" to="360 500 270" dur="12s" repeatCount="indefinite"/>
  </circle>
  <circle cx="500" cy="270" r="18" fill="#8b7cff">
    <animate attributeName="r" values="15;20;15" dur="2s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;.65;1" dur="2s" repeatCount="indefinite"/>
  </circle>
  <text x="500" y="264" text-anchor="middle" fill="#f0f6fc" font-family="monospace" font-size="15" font-weight="700">MUSUBI</text>
  <text x="500" y="283" text-anchor="middle" fill="#8b7cff" font-family="monospace" font-size="10">CONNECT</text>

  <!-- module cards -->
  <g>
    <rect x="55" y="145" width="250" height="92" rx="12" fill="#111820" stroke="#30363d"/>
    <circle cx="78" cy="169" r="6" fill="#8b7cff"/>
    <text x="94" y="174" fill="#f0f6fc" font-family="monospace" font-size="16" font-weight="700">TRIP</text>
    <text x="78" y="200" fill="#8b949e" font-family="monospace" font-size="12">CREATE • INVITE • EXPLORE</text>
    <text x="78" y="219" fill="#8b7cff" font-family="monospace" font-size="11">STATE: READY</text>
  </g>

  <g>
    <rect x="695" y="145" width="250" height="92" rx="12" fill="#111820" stroke="#30363d"/>
    <circle cx="718" cy="169" r="6" fill="#8b7cff"/>
    <text x="734" y="174" fill="#f0f6fc" font-family="monospace" font-size="16" font-weight="700">EXPENSES</text>
    <text x="718" y="200" fill="#8b949e" font-family="monospace" font-size="12">CAPTURE • ORGANIZE • TRACK</text>
    <text x="718" y="219" fill="#8b7cff" font-family="monospace" font-size="11">STATE: SYNCED</text>
  </g>

  <g>
    <rect x="55" y="330" width="250" height="92" rx="12" fill="#111820" stroke="#30363d"/>
    <circle cx="78" cy="354" r="6" fill="#8b7cff"/>
    <text x="94" y="359" fill="#f0f6fc" font-family="monospace" font-size="16" font-weight="700">SETTLEMENT</text>
    <text x="78" y="385" fill="#8b949e" font-family="monospace" font-size="12">BALANCE • SIMPLIFY • SETTLE</text>
    <text x="78" y="404" fill="#8b7cff" font-family="monospace" font-size="11">STATE: OPTIMIZING</text>
  </g>

  <g>
    <rect x="695" y="330" width="250" height="92" rx="12" fill="#111820" stroke="#30363d"/>
    <circle cx="718" cy="354" r="6" fill="#8b7cff"/>
    <text x="734" y="359" fill="#f0f6fc" font-family="monospace" font-size="16" font-weight="700">SYNC</text>
    <text x="718" y="385" fill="#8b949e" font-family="monospace" font-size="12">OFFLINE • RECONNECT • MERGE</text>
    <text x="718" y="404" fill="#8b7cff" font-family="monospace" font-size="11">STATE: ACTIVE</text>
  </g>

  <!-- animated connection paths -->
  <g fill="none" stroke="#8b7cff" stroke-width="2" opacity=".65">
    <path d="M305 191 C370 191 405 220 438 245"/>
    <path d="M695 191 C630 191 595 220 562 245"/>
    <path d="M305 376 C370 376 405 322 438 295"/>
    <path d="M695 376 C630 376 595 322 562 295"/>
  </g>

  <!-- travelling packets -->
  <g fill="#b8aeff">
    <circle r="4">
      <animateMotion dur="2.8s" repeatCount="indefinite" path="M305 191 C370 191 405 220 438 245"/>
    </circle>
    <circle r="4">
      <animateMotion dur="3.1s" repeatCount="indefinite" path="M695 191 C630 191 595 220 562 245" begin=".6s"/>
    </circle>
    <circle r="4">
      <animateMotion dur="3s" repeatCount="indefinite" path="M305 376 C370 376 405 322 438 295" begin="1s"/>
    </circle>
    <circle r="4">
      <animateMotion dur="2.7s" repeatCount="indefinite" path="M695 376 C630 376 595 322 562 295" begin=".3s"/>
    </circle>
  </g>

  <!-- footer -->
  <line x1="42" y1="462" x2="958" y2="462" stroke="#30363d"/>
  <text x="42" y="488" fill="#6e7681" font-family="monospace" font-size="11">CREATE • CONNECT • SETTLE • SYNC</text>
  <text x="958" y="488" text-anchor="end" fill="#6e7681" font-family="monospace" font-size="11">PRODUCT SYSTEM // DETAILS INTENTIONALLY ABSTRACTED</text>
</svg>
